[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-review-analyzer"
version = "0.1.0"
description = "Greek and English review sentiment with reproducible baseline and partial Transformer fine-tuning"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn==1.8.0", "joblib>=1.4,<2",
                "openpyxl>=3.1,<4", "pydantic>=2.9,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
deep = ["torch>=2.6,<3", "transformers>=4.46,<5", "safetensors>=0.4,<1", "huggingface-hub>=0.34,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
review-analyzer = "review_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
